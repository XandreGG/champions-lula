<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A2E">
<title>Champions Lula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Champions Lula">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="cielo" aria-hidden="true"></div>

<header class="cabecera">
  <div class="marca">
    <img id="marca-logo" alt="" hidden>
    <div class="marca-txt">
      <h1 id="marca-nombre">Champions Lula</h1>
      <p id="marca-edicion"></p>
    </div>
  </div>
  <p class="actualizado" id="actualizado"></p>
</header>

<nav class="nav" id="nav" aria-label="Secciones"></nav>

<main id="vista"></main>

<footer class="pie">
  <p id="pie-txt">Champions Lula</p>
</footer>

<script>
/* Los datos se piden con una marca de tiempo para saltarse la caché.
   Sin esto, GitHub sirve el archivo con max-age=600 y los participantes
   seguirían viendo la clasificación anterior durante al menos diez minutos
   después de que el administrador publicara la nueva. */
(function () {
  var t = Date.now();

  function cargar(src, siguiente) {
    var s = document.createElement("script");
    s.src = src + "?t=" + t;
    s.onload = siguiente;
    s.onerror = function () {
      document.getElementById("vista").innerHTML =
        '<div class="tarjeta"><div class="vacio"><strong>No he podido ' +
        "cargar los datos</strong>Comprueba que tienes conexión y vuelve a " +
        "intentarlo.</div></div>";
    };
    document.body.appendChild(s);
  }

  cargar("datos.js", function () { cargar("app.js"); });
})();
</script>
</body>
</html>
